    - generic [ref=f1e156]:
      - heading "How it works" [level=2] [ref=f1e157]
      - generic [ref=f1e158]:
        - paragraph [ref=f1e159]: Round Economy locks all real bets before flight, then Fair mode picks a crash table by current reserve — never by bet amounts — so every player in a round faces the same disclosed odds.
        - paragraph [ref=f1e160]: Global Win Rate — Fair auto-selects Tight (reserve < ₹3L), Normal (₹3L–₹7L), or a 70/30 Normal/Bonus mix (reserve ≥ ₹7L); Protect uses a fixed conservative table (70% 1.00×–1.30×, 28% 1.30×–2.00×, 2% 2.00×–2.50×) for thin-reserve periods; Custom forces every round to the exact multiplier you enter.
        - paragraph [ref=f1e161]: Bet Limits apply to all players — bets outside this range are rejected.
        - paragraph [ref=f1e162]: Changes save automatically and take effect on the next round. The live multiplier and recent crash history are shown in the top bar.